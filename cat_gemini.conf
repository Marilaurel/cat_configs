# Shadowrocket: 2026-04-07 08:54:29

[General]
# 1. Provide local fallback DNS, but tell Shadowrocket to use system standard
dns-server = 1.1.1.1, 9.9.9.9

# 2. Force Shadowrocket to prioritize remote DNS for proxy rules
bypass-system = true

# 3. Hijack standard local DNS traffic (Port 53) and force it into the tunnel logic
hijack-dns = 8.8.8.8:53, 8.8.44:53, 1.1.1.1:53, 9.9.9.9:53

# 4. Strict timing to prevent local fallbacks if the remote takes a moment
dns-timeout = 4

[Rule]
# Force all standard DNS port traffic through the Proxy (VLESS)
PORT-RULE,53,PROXY

# Ensure common encrypted DNS endpoints go through the proxy as well
DOMAIN-KEYWORD,dns.cloudflare,PROXY
DOMAIN-KEYWORD,dns.google,PROXY

# Final fallback for unmatched traffic (Set this to PROXY to test if leaks stop completely)
FINAL,PROXY

localhost = 127.0.0.1
