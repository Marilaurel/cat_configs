[General]
# --- Advanced Traffic Inspection ---
# Forces Shadowrocket to sniff domain names from TLS SNI and HTTP Host headers
sniffing = true

# --- DNS & Routing Optimization ---
# Fallback local servers, overridden by proxy rules
dns-server = 1.1.1.1, 9.9.9.9
# Forces Shadowrocket to handle matching logic before system default DNS takes over
bypass-system = true
# Intercepts standard port 53 traffic to prevent localized leaks
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 9.9.9.9:53
dns-timeout = 4
ipv6 = false

[Proxy]
# Replace this line with your actual VLESS node configuration parameters
Estonia-VLESS = vless://YXV0bzo3YmZiY2QyNC04MjNjLTQzNDctOTRjMy1jZGFlMTM1Y2ZlNTdAZXN0MDFjYXRib3Jpcy5zdGVsLnN0OjQ0Mw?remarks=%F0%9F%87%AA%F0%9F%87%AA%D0%AD%D1%81%D1%82%D0%BE%D0%BD%D0%B8%D1%8F&tls=1&peer=est01catboris.stel.st&xtls=2&pbk=fNgUAQYkTEopaGWJ8e44tMO0Qw96cZ1-Uv1-b_U-eB0&sid=30a6da07fdc289d6

[Rule]
# 1. Force all standard DNS traffic through the Estonian VLESS Node
PORT-RULE,53,Estonia-VLESS

# 2. Force Encrypted DNS Provider domains into the tunnel
DOMAIN-KEYWORD,dns.cloudflare,Estonia-VLESS
DOMAIN-KEYWORD,dns.google,Estonia-VLESS

# 3. Explicitly force all Google, AI, and Gemini domains through the proxy
DOMAIN-KEYWORD,google,Estonia-VLESS
DOMAIN-KEYWORD,gemini.google,Estonia-VLESS
DOMAIN-SUFFIX,google.com,Estonia-VLESS
DOMAIN-SUFFIX,generativeai.google,Estonia-VLESS

# 4. Global Fallback Policy
# Set to Estonia-VLESS to guarantee absolute routing isolation during testing
FINAL,Estonia-VLESS

[Host]
# Local network mapping defaults (Optional block)
localhost = 127.0.0.1
